# control-viz — the scrub player and the static server that feeds it, as a project of its own.
#
#   make test    # the route table's bytes, sent over a real socket
#   make serve   # 127.0.0.1:8321, read-only (see the Makefile for the roots)
#
# No engine, no build.rs and no runtime dependency: the server is std's own TcpListener, and the page
# is this crate's viz/ with the three.js pinned under viz/lib/ (whose README carries the sha256s).

[package]
name = "control-viz"
description = "The scrub player and the static server that feeds it: the route table, the byte-exact responses and the player page with its pinned three.js. Pure serving, no engine and no model."
version = "0.1.0"
edition = "2021"
# The stack's toolchain floor: the oldest compiler the sibling crates build and test with.
rust-version = "1.87"
license = "MIT"

# No runtime dependency, Rust or native: std's TcpListener, std::fs, and the route table in lib.rs.
[dependencies]

# DEV-only: the comment rules, which this crate's own prose is held to (tests/comment_why.rs). It reads
# text, has no dependencies of its own, and nothing that depends on this crate links it.
[dev-dependencies]
comment-why = { path = "../comment-why" }
